services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env          # OPENROUTER_API_KEY and other settings
    environment:
      WORKSPACE_DIR: /workspace
      CITATION_VERIFIER_URL: http://citation-verifier:3200
    volumes:
      - workspace:/workspace    # generated experiment repos (persisted)
      - backend_data:/app/data  # SQLite db + uploads (persisted)
    ports:
      - "8000:8000"             # direct API access (optional; frontend proxies too)
    depends_on:
      - citation-verifier
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"               # open http://localhost:5173
    restart: unless-stopped

  citation-verifier:
    build: ./citation-verifier
    env_file:
      - ./backend/.env          # reuses CUSTOM_API_KEY / CUSTOM_API_BASE_URL / CUSTOM_API_MODEL
    ports:
      - "3200:3200"             # standalone verify UI — the "Verify References" navbar link
    restart: unless-stopped

volumes:
  workspace:
  backend_data:
